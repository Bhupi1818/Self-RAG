services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
  ui:
    build: .
    env_file: .env
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
